version: 2.1

executors:
  node:
    docker:
      # .nvmrc / engines: Node 24
      - image: cimg/node:24.0
    working_directory: ~/project

  # Electron needs the system libraries Chrome does, which the -browsers image has
  browsers:
    docker:
      - image: cimg/node:24.0-browsers
    working_directory: ~/project

commands:
  install_deps:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  # what launching the app on Linux needs beyond the -browsers image: a display (xvfb-run), if it
  # lacks one
  install_xvfb:
    steps:
      - run:
          name: Install xvfb
          command: |
            if ! command -v xvfb-run > /dev/null; then
              sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
            fi

jobs:
  lint:
    executor: node
    steps:
      - install_deps
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    executor: node
    steps:
      - install_deps
      - run: npm run typecheck

  test:
    # the tests run on Electron's Node (scripts/vitest.mts), so they need the -browsers image too
    executor: browsers
    steps:
      - install_deps
      - run:
          name: Run tests
          command: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest/results.xml
      - store_test_results:
          path: test-results

  build:
    executor: node
    steps:
      - install_deps
      - run: npm run build
      - store_artifacts:
          path: dist

  # Launches the built app and fails on any startup error (scripts/smoke.mts). --no-sandbox: the
  # container has no user namespaces for Chromium's sandbox, and its SUID helper isn't set up
  smoke:
    executor: browsers
    steps:
      - install_deps
      - install_xvfb
      - run: npm run smoke -- --no-sandbox

  # Packages the Linux AppImage, then launches it (extracted) and checks it starts and opens a
  # workspace (npm run smoke:packaged). macOS and Windows aren't built here (docs/releasing.md).
  package_linux:
    executor: browsers
    steps:
      - install_deps
      - install_xvfb
      - restore_cache:
          keys:
            - electron-builder-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - electron-builder-v1-{{ arch }}-
      - run:
          name: Package the AppImage
          command: npm run compile
      - save_cache:
          key: electron-builder-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/electron
            - ~/.cache/electron-builder
      - run:
          name: Smoke check the AppImage
          command: npm run smoke:packaged -- --no-sandbox
      # the AppImage alone: release/ also holds linux-unpacked, the same app unpacked
      - run:
          name: Collect the AppImage
          command: mkdir -p artifacts && cp release/*.AppImage artifacts/
      - store_artifacts:
          path: artifacts

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test
      - build
      - smoke
      - package_linux
