version: 2.1

executors:
  node:
    docker:
      # .nvmrc / engines: Node 24
      - image: cimg/node:24.0
    working_directory: ~/project

commands:
  install_deps:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  lint:
    executor: node
    steps:
      - install_deps
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    executor: node
    steps:
      - install_deps
      - run: npm run typecheck

  test:
    # the tests run on Electron's Node (scripts/vitest.mts), and the Electron binary needs the
    # system libraries Chrome does, which the -browsers image has
    docker:
      - image: cimg/node:24.0-browsers
    working_directory: ~/project
    steps:
      - install_deps
      - run:
          name: Run tests
          command: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest/results.xml
      - store_test_results:
          path: test-results

  build:
    executor: node
    steps:
      - install_deps
      - run: npm run build
      - store_artifacts:
          path: dist

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test
      - build
