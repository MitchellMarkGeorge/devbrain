version: 2.1

executors:
  node:
    docker:
      # .nvmrc / engines: Node 24
      - image: cimg/node:24.0
    working_directory: ~/project

  # Electron needs the system libraries Chrome does, which the -browsers image has
  browsers:
    docker:
      - image: cimg/node:24.0-browsers
    working_directory: ~/project

commands:
  install_deps:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  lint:
    executor: node
    steps:
      - install_deps
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    executor: node
    steps:
      - install_deps
      - run: npm run typecheck

  test:
    # the tests run on Electron's Node (scripts/vitest.mts), so they need the -browsers image too
    executor: browsers
    steps:
      - install_deps
      - run:
          name: Run tests
          command: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest/results.xml
      - store_test_results:
          path: test-results

  # The end-to-end tests (docs/testing.md): the built app, driven by Playwright, under Xvfb
  e2e:
    executor: browsers
    steps:
      - install_deps
      - run:
          name: Set up Electron
          command: |
            # the electron package downloads its binary on first use
            node -e "require('electron')"
            # Chromium's sandbox, as a non-root user in Docker: its helper must be setuid root
            sandbox=node_modules/electron/dist/chrome-sandbox
            sudo chown root:root "$sandbox" && sudo chmod 4755 "$sandbox"
            command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run:
          name: Run end-to-end tests
          command: npm run e2e
      - store_test_results:
          path: test-results/e2e
      # a failed test's trace, screenshot, main log and DevBrain folder; nothing is kept for a pass
      - store_artifacts:
          path: test-results/e2e
          when: on_fail

  build:
    executor: node
    steps:
      - install_deps
      - run: npm run build
      - store_artifacts:
          path: dist

  # Packages the Linux AppImage. macOS and Windows aren't built here (docs/releasing.md).
  package_linux:
    executor: node
    steps:
      - install_deps
      - restore_cache:
          keys:
            - electron-builder-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - electron-builder-v1-{{ arch }}-
      - run:
          name: Package the AppImage
          command: npm run compile
      - save_cache:
          key: electron-builder-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/electron
            - ~/.cache/electron-builder
      # the AppImage alone: release/ also holds linux-unpacked, the same app unpacked
      - run:
          name: Collect the AppImage
          command: mkdir -p artifacts && cp release/*.AppImage artifacts/
      - store_artifacts:
          path: artifacts

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test
      - e2e
      - build
      - package_linux
