appId: com.example.devbrain
productName: DevBrain
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# never .env: it holds the building machine's local secrets (see loadDevelopmentEnv in
# src/main/index.ts)
extraResources:
  - from: ./src/main/db/migrations
    to: migrations
mac:
  target: dmg
  category: public.app-category.utilities
win:
  target: nsis
linux:
  target: AppImage
